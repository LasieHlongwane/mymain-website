<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="theme-color"
        content="#e5f5ff"
    >

    <meta
        name="description"
        content="KALXA is the local economy creator stack — connecting residents, businesses, event organisers and creators in one connected ecosystem. Discover locally. Experience locally. Create locally. Get paid locally."
    >

    <meta
        name="robots"
        content="index, follow"
    >

    <title>
        KALXA — The Local Economy Creator Stack
    </title>

    <!-- OPEN GRAPH -->

    <meta property="og:title" content="KALXA — The Local Economy Creator Stack">
    <meta property="og:description" content="One ecosystem. Every local opportunity. Discover, experience, create and get paid — all in one connected platform.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://kalxa.co.za/">

    <!-- GOOGLE FONTS -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&amp;family=DM+Sans:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap"
        rel="stylesheet"
    >

    <!-- EXISTING CSS -->

    <link
        rel="stylesheet"
        href="/css/style.css?v=5"
    >

    <!-- FONT AWESOME -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- PRELOAD FIRST HERO IMAGE -->

    <link
        rel="preload"
        as="image"
        href="/images/kalxa-hero-bg.png"
    >

    <style>

        /* ==========================================
           GLOBAL VARIABLES
        ========================================== */

        :root {

            --ink: #111318;

            --muted: #52616d;

            --line: #dce7ee;

            --blue: #006aa6;

            --blue-deep: #003d61;

            --sand: #fff7e8;

            --sand-line: #f0dcb5;

            --green: #1a7a4a;

            --green-line: #b8e0c8;

            --purple: #5b3aa8;

            --purple-line: #d2c4f0;

            --font-heading:
                "Plus Jakarta Sans", sans-serif;

            --font-body:
                "DM Sans", sans-serif;

            --font-luxury:
                "Cormorant Garamond", Georgia, serif;

        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {

            margin: 0;

            color: var(--ink);

            font-family: var(--font-body);

            font-weight: 400;

            -webkit-font-smoothing: antialiased;

            text-rendering: optimizeLegibility;

        }

        h1,
        h2,
        h3,
        h4 {

            font-family: var(--font-heading);

            letter-spacing: -0.035em;

        }

        /* ==========================================
           BRAND
        ========================================== */

        .brand-text strong {

            font-family: var(--font-heading);

            font-weight: 800;

            letter-spacing: -1.5px;

        }

        .brand-text span {

            font-family: var(--font-body);

            font-size: 10px;

            letter-spacing: 1.4px;

            font-weight: 700;

        }

        .navbar nav a {

            font-family: var(--font-body);

            font-weight: 600;

            letter-spacing: -0.01em;

        }

        /* ==========================================
           HERO SECTION
           FIVE-IMAGE AUTOMATIC SLIDESHOW
        ========================================== */

        .site-hero {

            position: relative;

            isolation: isolate;

            overflow: hidden;

            background-color: #e5f5ff;

            min-height: 560px;

            padding: 110px 7% 105px;

            display: flex;

            align-items: center;

            justify-content: center;

        }

        /* ==========================================
           SLIDESHOW CONTAINER
        ========================================== */

        .hero-slideshow {

            position: absolute;

            inset: 0;

            z-index: -1;

            overflow: hidden;

            pointer-events: none;

            background-color: #e5f5ff;

        }

        /* ==========================================
           INDIVIDUAL BACKGROUND IMAGES
        ========================================== */

        .hero-slide {

            position: absolute;

            inset: 0;

            width: 100%;

            height: 100%;

            background-size: cover;

            background-position: center center;

            background-repeat: no-repeat;

            opacity: 0;

            visibility: hidden;

            transition:
                opacity 1s ease-in-out,
                visibility 1s ease-in-out;

            will-change: opacity;

        }

        /* ==========================================
           ACTIVE BACKGROUND IMAGE
        ========================================== */

        .hero-slide.active {

            opacity: 1;

            visibility: visible;

        }

        /* ==========================================
           VERY LIGHT IMAGE OVERLAY
        ========================================== */

        .hero-slideshow::after {

            content: "";

            position: absolute;

            inset: 0;

            z-index: 2;

            background:
                linear-gradient(
                    125deg,
                    rgba(255, 255, 255, 0.22) 0%,
                    rgba(255, 255, 255, 0.14) 50%,
                    rgba(235, 247, 255, 0.22) 100%
                );

            pointer-events: none;

        }

        /* ==========================================
           HERO CONTENT
        ========================================== */

        .site-hero .inner {

            width: 100%;

            max-width: 980px;

            margin: auto;

            text-align: center;

            position: relative;

            z-index: 3;

        }

        .site-hero h1,
        .site-hero h2 {

            font-size: clamp(38px, 5.5vw, 68px);

            font-weight: 800;

            line-height: 1.08;

            letter-spacing: -0.06em;

            max-width: 980px;

            margin: 18px auto 22px;

            color: #111318;

        }

        .luxury-text {

            font-family: var(--font-luxury);

            font-style: italic;

            font-weight: 600;

            color: var(--blue);

            letter-spacing: -0.035em;

        }

        .site-hero .eyebrow {

            color: #003d61;

            font-weight: 800;

            text-shadow:
                0 1px 2px rgba(255, 255, 255, 0.85);

        }

        .site-hero .lead {

            font-family: var(--font-body);

            font-size: clamp(16px, 2vw, 20px);

            line-height: 1.85;

            color: #2a3f4d;

            max-width: 780px;

            margin: 0 auto 26px;

            font-weight: 500;

            text-shadow:
                0 1px 2px rgba(255, 255, 255, 0.7);

        }

        /* ==========================================
           HERO LIFECYCLE STRIP
        ========================================== */

        .hero-cycle {

            display: flex;

            flex-wrap: wrap;

            align-items: center;

            justify-content: center;

            gap: 10px 14px;

            margin: 8px auto 28px;

            max-width: 820px;

            font-family: var(--font-body);

            font-weight: 700;

            font-size: clamp(12px, 1.5vw, 14px);

            letter-spacing: 0.04em;

            text-transform: uppercase;

            color: #003d61;

        }

        .hero-cycle span {

            display: inline-flex;

            align-items: center;

            gap: 8px;

            padding: 7px 14px;

            border-radius: 999px;

            background: rgba(255, 255, 255, 0.72);

            border: 1px solid rgba(0, 106, 166, 0.35);

            backdrop-filter: blur(6px);

            -webkit-backdrop-filter: blur(6px);

            text-shadow:
                0 1px 1px rgba(255, 255, 255, 0.85);

        }

        .hero-cycle i {

            color: #006aa6;

            font-size: 11px;

        }

        /* ==========================================
           SLIDESHOW INDICATORS
        ========================================== */

        .hero-slide-indicators {

            position: absolute;

            bottom: 25px;

            left: 50%;

            transform: translateX(-50%);

            z-index: 5;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

        }

        .hero-indicator {

            width: 9px;

            height: 9px;

            padding: 0;

            border: none;

            border-radius: 50%;

            background: rgba(255, 255, 255, 0.65);

            box-shadow:
                0 1px 5px rgba(0, 0, 0, 0.18);

            cursor: pointer;

            transition:
                background 0.25s ease,
                transform 0.25s ease;

        }

        .hero-indicator.active {

            background: #006aa6;

            transform: scale(1.2);

        }

        .hero-indicator:hover {

            background: #006aa6;

        }

        .hero-indicator:focus-visible {

            outline: 3px solid #006aa6;

            outline-offset: 4px;

        }

        /* ==========================================
           SECTIONS
        ========================================== */

        .section-shell {

            padding: 80px 7%;

        }

        .section-shell.soft {

            background: #f8fafc;

        }

        .section-shell.warm {

            background: #fdfaf3;

        }

        .section-inner {

            max-width: 1200px;

            margin: auto;

        }

        .section-title {

            text-align: center;

            max-width: 800px;

            margin: 0 auto 42px;

        }

        .section-title h2 {

            font-size: clamp(30px, 4vw, 46px);

            font-weight: 800;

            line-height: 1.2;

            letter-spacing: -0.045em;

            margin: 12px 0;

        }

        .section-title p {

            color: var(--muted);

            line-height: 1.85;

            font-family: var(--font-body);

            font-size: 16px;

        }

        .section-title h3 {

            font-size: clamp(24px, 3vw, 34px);

            font-weight: 800;

            line-height: 1.25;

            letter-spacing: -0.04em;

            margin: 12px 0;

        }

        .eyebrow,
        .section-label {

            font-family: var(--font-body);

            font-weight: 700;

            letter-spacing: 2.5px;

            font-size: 11px;

            text-transform: uppercase;

            color: var(--blue);

        }

        /* ==========================================
           THE LOOP — FLYWHEEL
        ========================================== */

        .loop-grid {

            display: grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            gap: 18px;

            margin-top: 8px;

        }

        .loop-step {

            position: relative;

            padding: 28px 22px;

            border-radius: 16px;

            background: #fff;

            border: 1px solid var(--line);

            box-shadow:
                0 4px 14px rgba(0, 76, 125, 0.04);

        }

        .loop-step .step-no {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            width: 34px;

            height: 34px;

            border-radius: 10px;

            background: #e5f5ff;

            color: #006aa6;

            font-family: var(--font-heading);

            font-weight: 800;

            font-size: 14px;

            margin-bottom: 14px;

        }

        .loop-step h3 {

            font-size: 19px;

            font-weight: 800;

            line-height: 1.3;

            letter-spacing: -0.03em;

            margin: 0 0 10px;

        }

        .loop-step p {

            color: var(--muted);

            font-family: var(--font-body);

            font-size: 14px;

            line-height: 1.75;

            margin: 0;

        }

        .loop-step .tool {

            display: inline-block;

            margin-top: 14px;

            padding: 4px 10px;

            border-radius: 6px;

            background: #f4fbff;

            border: 1px solid #cdeaff;

            color: #075f91;

            font-family: var(--font-body);

            font-size: 11px;

            font-weight: 700;

            letter-spacing: 0.5px;

            text-transform: uppercase;

        }

        .loop-arrow {

            display: none;

        }

        .loop-footer {

            margin-top: 30px;

            text-align: center;

            font-family: var(--font-body);

            font-size: 14px;

            color: var(--muted);

            line-height: 1.8;

        }

        .loop-footer strong {

            color: var(--ink);

        }

        /* ==========================================
           ROLES
        ========================================== */

        .roles-grid {

            display: grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            gap: 18px;

        }

        .role-card {

            padding: 26px 22px;

            border-radius: 16px;

            border: 1px solid var(--line);

            background: #fff;

            display: flex;

            flex-direction: column;

        }

        .role-card .role-icon {

            width: 42px;

            height: 42px;

            border-radius: 12px;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            font-size: 18px;

            margin-bottom: 16px;

        }

        .role-card.resident .role-icon {

            background: #e5f5ff;

            color: #006aa6;

        }

        .role-card.business .role-icon {

            background: var(--sand);

            color: #8a5a00;

        }

        .role-card.organiser .role-icon {

            background: #eaf7ef;

            color: var(--green);

        }

        .role-card.creator .role-icon {

            background: #f0ebff;

            color: var(--purple);

        }

        .role-card h3 {

            font-size: 18px;

            font-weight: 800;

            letter-spacing: -0.03em;

            margin: 0 0 8px;

        }

        .role-card p {

            color: var(--muted);

            font-family: var(--font-body);

            font-size: 14px;

            line-height: 1.75;

            margin: 0 0 14px;

            flex: 1;

        }

        .role-card .role-needs {

            font-family: var(--font-body);

            font-size: 12px;

            font-weight: 700;

            letter-spacing: 0.02em;

            color: #6a7883;

            text-transform: uppercase;

        }

        .role-card .role-needs span {

            color: var(--ink);

            display: block;

            margin-top: 4px;

            font-size: 13px;

            text-transform: none;

            font-weight: 600;

            letter-spacing: 0;

            color: #344b5b;

        }

        /* ==========================================
           MARKETPLACE HIGHLIGHT
        ========================================== */

        .marketplace {

            background:
                linear-gradient(
                    135deg,
                    #f4fbff 0%,
                    #e6f4ff 45%,
                    #fdfaf3 100%
                );

            border: 1px solid #cdeaff;

            border-radius: 22px;

            padding: 44px;

            display: grid;

            grid-template-columns: 1.15fr 1fr;

            gap: 42px;

            align-items: center;

        }

        .marketplace h2 {

            font-size: clamp(28px, 3.6vw, 42px);

            font-weight: 800;

            line-height: 1.15;

            letter-spacing: -0.045em;

            margin: 12px 0 18px;

        }

        .marketplace p {

            color: #344b5b;

            line-height: 1.85;

            font-family: var(--font-body);

            font-size: 16px;

            margin: 0 0 14px;

        }

        .marketplace .market-list {

            list-style: none;

            padding: 0;

            margin: 18px 0 0;

            display: flex;

            flex-direction: column;

            gap: 10px;

        }

        .marketplace .market-list li {

            display: flex;

            gap: 12px;

            align-items: flex-start;

            font-family: var(--font-body);

            font-size: 15px;

            color: #22333f;

            line-height: 1.7;

        }

        .marketplace .market-list i {

            color: #006aa6;

            margin-top: 4px;

            font-size: 14px;

        }

        .marketplace-visual {

            background: #ffffff;

            border: 1px solid #d5e9f7;

            border-radius: 18px;

            padding: 26px;

            box-shadow:
                0 12px 30px rgba(0, 76, 125, 0.07);

        }

        .deal-card {

            display: flex;

            gap: 14px;

            padding: 16px;

            border-radius: 14px;

            border: 1px solid #e3edf5;

            background: #fbfdff;

            margin-bottom: 12px;

        }

        .deal-card:last-child {

            margin-bottom: 0;

        }

        .deal-avatar {

            width: 44px;

            height: 44px;

            border-radius: 12px;

            flex-shrink: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            font-family: var(--font-heading);

            font-weight: 800;

            color: #fff;

            font-size: 15px;

        }

        .deal-avatar.creator {

            background: #5b3aa8;

        }

        .deal-avatar.business {

            background: #8a5a00;

        }

        .deal-avatar.payout {

            background: #1a7a4a;

        }

        .deal-body {

            min-width: 0;

            flex: 1;

        }

        .deal-body .deal-title {

            font-family: var(--font-heading);

            font-weight: 800;

            font-size: 14px;

            color: var(--ink);

            letter-spacing: -0.02em;

            margin: 0 0 3px;

        }

        .deal-body .deal-meta {

            font-family: var(--font-body);

            font-size: 12.5px;

            color: #6a7883;

            margin: 0;

            line-height: 1.55;

        }

        .deal-body .deal-amount {

            font-family: var(--font-heading);

            font-weight: 800;

            font-size: 13px;

            color: #1a7a4a;

            margin-top: 6px;

        }

        .marketplace-foot {

            margin-top: 18px;

            font-family: var(--font-body);

            font-size: 12px;

            color: #6a7883;

            line-height: 1.7;

        }

        /* ==========================================
           WHO IT'S FOR — AUDIENCE SPLIT
        ========================================== */

        .audience-grid {

            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 20px;

        }

        .audience-card {

            padding: 32px 28px;

            border-radius: 18px;

            background: #fff;

            border: 1px solid var(--line);

            display: flex;

            flex-direction: column;

        }

        .audience-card h3 {

            font-size: 22px;

            font-weight: 800;

            line-height: 1.3;

            letter-spacing: -0.035em;

            margin: 12px 0 12px;

        }

        .audience-card p {

            color: var(--muted);

            font-family: var(--font-body);

            font-size: 15px;

            line-height: 1.8;

            margin: 0 0 20px;

            flex: 1;

        }

        .audience-card .audience-cta {

            font-family: var(--font-body);

            font-weight: 700;

            letter-spacing: -0.015em;

            color: var(--blue);

            text-decoration: none;

            font-size: 15px;

        }

        .audience-card .audience-cta:hover {

            text-decoration: underline;

        }

        .audience-card.creator-audience {

            border-color: var(--purple-line);

            background:
                linear-gradient(
                    160deg,
                    #ffffff 0%,
                    #f9f7ff 100%
                );

        }

        .audience-card.business-audience {

            border-color: var(--sand-line);

            background:
                linear-gradient(
                    160deg,
                    #ffffff 0%,
                    #fffdf7 100%
                );

        }

        .audience-card.resident-audience {

            border-color: #cdeaff;

            background:
                linear-gradient(
                    160deg,
                    #ffffff 0%,
                    #f6fcff 100%
                );

        }

        /* ==========================================
           HOW IT WORKS — NEIGHBOURHOOD STORY
        ========================================== */

        .story-grid {

            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 20px;

        }

        .story-card {

            padding: 30px 26px;

            border-radius: 16px;

            background: #fff;

            border: 1px solid var(--line);

            display: flex;

            flex-direction: column;

        }

        .story-card .story-step {

            display: inline-flex;

            align-items: center;

            gap: 8px;

            font-family: var(--font-body);

            font-size: 11px;

            font-weight: 800;

            letter-spacing: 2px;

            text-transform: uppercase;

            color: var(--blue);

            margin-bottom: 14px;

        }

        .story-card h3 {

            font-size: 20px;

            font-weight: 800;

            letter-spacing: -0.03em;

            line-height: 1.3;

            margin: 0 0 12px;

        }

        .story-card p {

            color: var(--muted);

            font-family: var(--font-body);

            font-size: 15px;

            line-height: 1.8;

            margin: 0;

        }

        .story-card strong {

            color: var(--ink);

        }

        /* ==========================================
           PRODUCTS — ECOSYSTEM MODES
        ========================================== */

        .cards {

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 22px;

        }

        .card {

            padding: 30px;

            border: 1px solid var(--line);

            border-radius: 16px;

            background: #fff;

            display: flex;

            flex-direction: column;

            min-width: 0;

        }

        .card .card-mode {

            font-family: var(--font-body);

            font-size: 11px;

            font-weight: 800;

            letter-spacing: 2px;

            text-transform: uppercase;

            color: var(--blue);

            margin-bottom: 10px;

        }

        .card h3 {

            font-size: 22px;

            font-weight: 700;

            line-height: 1.35;

            letter-spacing: -0.035em;

            margin: 0 0 13px;

        }

        .card p {

            color: var(--muted);

            font-family: var(--font-body);

            font-size: 15px;

            line-height: 1.85;

            margin: 0 0 22px;

            flex: 1;

        }

        .card a {

            font-family: var(--font-body);

            font-weight: 700;

            letter-spacing: -0.015em;

            color: var(--blue);

            text-decoration: none;

        }

        .card a:hover {
            text-decoration: underline;
        }

        /* ==========================================
           GENERAL BUTTONS
        ========================================== */

        .actions {

            display: flex;

            gap: 14px;

            flex-wrap: wrap;

            justify-content: center;

            margin-top: 25px;

        }

        .actions a {
            text-decoration: none;
        }

        .button.primary-button,
        .button.secondary-button {

            display: inline-block;

            padding: 13px 22px;

            border-radius: 9px;

            font-family: var(--font-body);

            font-weight: 700;

            letter-spacing: -0.015em;

            transition:
                transform 0.25s ease,
                filter 0.25s ease,
                border-color 0.25s ease;

        }

        .button.primary-button {

            background: #006aa6;

            color: #fff;

        }

        .button.secondary-button {

            border: 1px solid #9bc8e2;

            color: #075f91;

            background: #fff;

        }

        .button:hover {

            filter: brightness(0.95);

            transform: translateY(-2px);

        }

        /* ==========================================
           HERO BUTTONS — COMPLETELY TRANSPARENT
        ========================================== */

        .site-hero .actions .button.primary-button,
        .site-hero .actions .button.secondary-button {

            background: transparent;

            background-color: transparent;

            background-image: none;

            color: #073d5c;

            border: 1.5px solid rgba(0, 74, 115, 0.85);

            box-shadow: none;

            backdrop-filter: none;

            -webkit-backdrop-filter: none;

            padding: 14px 24px;

            border-radius: 10px;

            font-size: 14px;

            font-weight: 800;

            text-decoration: none;

            text-shadow:
                0 1px 2px rgba(255, 255, 255, 0.85);

            transition:
                transform 0.25s ease,
                border-color 0.25s ease,
                color 0.25s ease;

        }

        .site-hero .actions .button.primary-button:hover,
        .site-hero .actions .button.secondary-button:hover {

            background: transparent;

            background-color: transparent;

            background-image: none;

            color: #002f4d;

            border-color: #003f66;

            box-shadow: none;

            filter: none;

            transform: translateY(-3px);

        }

        .site-hero .actions .button.primary-button:focus-visible,
        .site-hero .actions .button.secondary-button:focus-visible {

            outline: 3px solid #006aa6;

            outline-offset: 4px;

        }

        /* ==========================================
           CUSTOM DEVELOPMENT
        ========================================== */

        .service-highlight {

            margin-top: 25px;

            border: 1px solid #b8def3;

            background:
                linear-gradient(
                    125deg,
                    #fff,
                    #edf8ff
                );

            border-radius: 18px;

            padding: 34px;

            display: grid;

            grid-template-columns: 1fr auto;

            align-items: center;

            gap: 25px;

        }

        .service-highlight h3 {

            font-size: clamp(23px, 3vw, 30px);

            margin: 10px 0;

        }

        .service-highlight p {

            color: var(--muted);

            line-height: 1.8;

            margin: 0;

        }

        .service-highlight .button {

            white-space: nowrap;

            text-decoration: none;

        }

        .steps {

            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 20px;

        }

        .steps .card p {
            margin-bottom: 0;
        }

        .section-copy {

            max-width: 780px;

            margin: 0 auto 32px;

            color: var(--muted);

            line-height: 1.9;

            text-align: center;

        }

        /* ==========================================
           CONTACT BAND
        ========================================== */

        .contact-band {

            text-align: center;

            background:
                linear-gradient(
                    120deg,
                    #f4fbff,
                    #e4f4ff,
                    #f7fcff
                );

            padding: 70px 7%;

        }

        .contact-band h2 {

            font-size: clamp(28px, 3.6vw, 42px);

            font-weight: 800;

            letter-spacing: -0.045em;

            line-height: 1.2;

            margin: 12px 0 14px;

        }

        .contact-band p {

            color: var(--muted);

            font-family: var(--font-body);

            font-size: 16px;

            line-height: 1.85;

            max-width: 720px;

            margin: 0 auto 22px;

        }

        .contact-band .section-label {

            color: var(--blue);

        }

        /* ==========================================
           FOOTER
        ========================================== */

        .company-footer {

            background:
                linear-gradient(
                    120deg,
                    #edf8ff,
                    #d6efff 45%,
                    #f5fbff
                );

            padding: 60px 7% 30px;

            border-top: 1px solid #c4e3f5;

            color: #263746;

            font-family: var(--font-body);

        }

        .footer-main {

            display: grid;

            grid-template-columns: 1.2fr 1fr;

            gap: 70px;

            padding-bottom: 40px;

        }

        .footer-company h3 {

            font-size: 24px;

            font-weight: 800;

            letter-spacing: -0.04em;

            margin: 0 0 16px;

        }

        .footer-company p,
        .footer-company address {

            font-size: 14px;

            line-height: 1.85;

            color: #344b5b;

            font-style: normal;

        }

        .footer-company .footer-tagline {

            margin-top: 14px;

            font-family: var(--font-body);

            font-size: 13.5px;

            line-height: 1.75;

            color: #4b6373;

            max-width: 380px;

        }

        .footer-navigation h3 {

            font-size: 18px;

            margin: 0 0 20px;

        }

        .footer-navigation-grid {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 30px;

        }

        .footer-link-group {

            display: flex;

            flex-direction: column;

            gap: 12px;

        }

        .footer-link-group h4 {

            font-size: 12px;

            letter-spacing: 1px;

            text-transform: uppercase;

            color: #526d80;

            margin: 0 0 4px;

        }

        .footer-link-group a,
        .footer-support a {

            color: #263746;

            text-decoration: none;

            font-size: 14px;

            line-height: 1.6;

            overflow-wrap: anywhere;

        }

        .footer-link-group a:hover,
        .footer-support a:hover {

            color: var(--blue);

            text-decoration: underline;

        }

        /* ==========================================
           FOOTER SUPPORT
        ========================================== */

        .footer-support {

            border-block: 1px solid #c4e3f5;

            padding: 25px 0;

        }

        .footer-support h4 {
            margin: 0 0 12px;
        }

        .footer-support-links {

            display: flex;

            align-items: center;

            flex-wrap: wrap;

            gap: 18px 30px;

        }

        .footer-contact-link {

            display: inline-flex;

            align-items: center;

            gap: 10px;

            text-decoration: none;

            font-family: var(--font-body);

            font-size: 14px;

            font-weight: 600;

            color: #263746;

            transition:
                transform 0.25s ease,
                opacity 0.25s ease;

        }

        .footer-contact-link i {

            font-size: 19px;

            color: #006aa6;

            transition: transform 0.25s ease;

        }

        .footer-contact-link:hover {

            transform: translateY(-2px);

            opacity: 0.85;

        }

        .footer-contact-link:hover i {

            transform: scale(1.12);

        }

        .footer-contact-link:focus-visible {

            outline: 2px solid #006aa6;

            outline-offset: 5px;

            border-radius: 3px;

        }

        .footer-bottom {

            display: flex;

            justify-content: space-between;

            gap: 15px;

            flex-wrap: wrap;

            padding-top: 22px;

            font-size: 12px;

            color: #526d80;

        }

        .footer-bottom p {
            margin: 0;
        }

        ========================================== */
